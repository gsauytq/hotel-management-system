# HTTP 仅用于跳转 HTTPS；不得在 80 端口承载登录或业务请求。
server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 证书由 compose 只读挂载到 /etc/nginx/certs；文件名固定，私钥不得入库。
  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # security-design.md §7：HTTPS 下启用 HSTS 与 SPA 基础安全头
  add_header Strict-Transport-Security "max-age=15552000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'" always;

  # 同源反代：/api/* → api 容器（ADR-010）
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    # 保留客户端 Host（含非默认端口），与 CSRF 同源判断保持一致
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA history 路由回退
  location / {
    try_files $uri $uri/ /index.html;
  }
}
